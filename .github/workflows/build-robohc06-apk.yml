name: Build Robo HC-06 APK

on:
  push:
    paths:
      - "RoboHC06App/**"
      - ".github/workflows/build-robohc06-apk.yml"
  pull_request:
    paths:
      - "RoboHC06App/**"
      - ".github/workflows/build-robohc06-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: RoboHC06App

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: robo-hc06-debug-apk
          path: RoboHC06App/app/build/outputs/apk/debug/app-debug.apk
